name: Deploy Palak Developers to Cloudflare Pages

# Manual only (2026-09-10). The live sites now build from their own repos
# (palak-developers, Palak-steel-mill, preedos), and these app copies are older.
# On push, this workflow uploaded the stale copy over the live project.
on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build Palak Developers
        run: pnpm --filter palak-developers build
      
      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: palak-developers
          directory: apps/palak-developers/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
